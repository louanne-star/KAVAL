<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Traverse la Rivière</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0d1f0d;
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; overflow:hidden; touch-action:none;
}
canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = Math.min(window.innerWidth, 420);
const H = Math.min(window.innerHeight, 720);
canvas.width = W; canvas.height = H;

function makeRocks() {
  return [
    { bx:W*0.22, by:H*0.20, lat:{a:28,sp:0.018,ph:0},   dep:{a:10,sp:0.013,ph:1.0}, sink:{sp:0.022,ph:0.0} },
    { bx:W*0.65, by:H*0.23, lat:{a:22,sp:0.015,ph:2.1}, dep:{a:8, sp:0.017,ph:0.5}, sink:{sp:0.019,ph:2.4} },
    { bx:W*0.40, by:H*0.32, lat:{a:30,sp:0.021,ph:1.2}, dep:{a:12,sp:0.011,ph:2.2}, sink:{sp:0.025,ph:1.1} },
    { bx:W*0.75, by:H*0.35, lat:{a:20,sp:0.016,ph:3.3}, dep:{a:9, sp:0.014,ph:0.8}, sink:{sp:0.020,ph:3.5} },
    { bx:W*0.18, by:H*0.44, lat:{a:25,sp:0.019,ph:0.7}, dep:{a:11,sp:0.016,ph:1.5}, sink:{sp:0.023,ph:0.8} },
    { bx:W*0.55, by:H*0.47, lat:{a:32,sp:0.017,ph:2.8}, dep:{a:7, sp:0.012,ph:3.1}, sink:{sp:0.021,ph:2.0} },
    { bx:W*0.30, by:H*0.56, lat:{a:26,sp:0.020,ph:1.9}, dep:{a:13,sp:0.015,ph:0.3}, sink:{sp:0.024,ph:1.6} },
    { bx:W*0.70, by:H*0.59, lat:{a:22,sp:0.023,ph:0.4}, dep:{a:8, sp:0.018,ph:2.7}, sink:{sp:0.018,ph:4.1} },
    { bx:W*0.20, by:H*0.68, lat:{a:28,sp:0.016,ph:3.0}, dep:{a:10,sp:0.013,ph:1.8}, sink:{sp:0.022,ph:2.9} },
    { bx:W*0.60, by:H*0.71, lat:{a:24,sp:0.018,ph:1.5}, dep:{a:9, sp:0.016,ph:0.6}, sink:{sp:0.026,ph:0.3} },
  ];
}

let rocks, playerRock, state, jump, waveT, particles;

function resetGame() {
  rocks = makeRocks();
  playerRock = -1;
  state = 'play';
  jump = null;
  waveT = 0;
  particles = [];
}
resetGame();

// ── ROCK STATE ───────────────────────────────────────────────────
function getRockState(r, t, occupied) {
  const lx = r.bx + Math.sin(t * r.lat.sp + r.lat.ph) * r.lat.a;
  const dy = Math.sin(t * r.dep.sp + r.dep.ph) * r.dep.a;
  const ly = r.by + dy;
  const raw = Math.sin(t * r.sink.sp + r.sink.ph);
  let sinkVal = raw > 0.3 ? 0 : (0.3 - raw) / 1.3;
  if (occupied) sinkVal = 0;
  const visible = sinkVal < 0.92;
  return { x: lx, y: ly, sinkVal, visible };
}

function isJumpable(rockIdx) {
  const s = getRockState(rocks[rockIdx], waveT, rockIdx === playerRock);
  return s.sinkVal < 0.18;
}

// ── PARTICULES ───────────────────────────────────────────────────
function splash(x, y, color) {
  for (let i = 0; i < 14; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 1 + Math.random() * 3.5;
    particles.push({ x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd-2,
      life:1, decay:0.03+Math.random()*0.03, r:2+Math.random()*4, color });
  }
}
function ripple(x, y) {
  particles.push({ type:'ripple', x, y, r:4, life:1, decay:0.025 });
}

// ── INPUT ────────────────────────────────────────────────────────
function handleTap(cx, cy) {
  if (state === 'dead' || state === 'win') { resetGame(); return; }
  if (state !== 'play') return;

  let fromX, fromY;
  if (playerRock === -1) {
    fromX = W*0.5; fromY = H*0.11;
  } else {
    const rs = getRockState(rocks[playerRock], waveT, true);
    fromX = rs.x; fromY = rs.y;
  }

  let best = -1, bestD = 9999;
  rocks.forEach((r, i) => {
    if (i === playerRock) return;
    const rs = getRockState(r, waveT, false);
    if (!rs.visible) return;
    const d = Math.hypot(cx - rs.x, cy - rs.y);
    if (d < 72 && d < bestD) { bestD = d; best = i; }
  });

  const arrX = W*0.5, arrY = H*0.88;
  if (Math.hypot(cx-arrX, cy-arrY) < 55 && playerRock >= 8) {
    startJump(fromX, fromY, arrX, arrY, () => {
      state = 'win';
      setTimeout(() => window.parent.postMessage({ type: 'jeuTermine' }, '*'), 1800);
    });
    return;
  }

  if (best < 0) return;

  const rs = getRockState(rocks[best], waveT, false);

  const MAX_JUMP = 160;
  if (Math.hypot(fromX - rs.x, fromY - rs.y) > MAX_JUMP) return;

  if (!isJumpable(best)) {
    startJump(fromX, fromY, rs.x, rs.y, () => {
      splash(rs.x, rs.y, '#64D8CB');
      ripple(rs.x, rs.y);
      state = 'dead';
    });
    return;
  }

  startJump(fromX, fromY, rs.x, rs.y, () => {
    playerRock = best;
    splash(rs.x, rs.y, 'rgba(200,255,240,0.8)');
    ripple(rs.x, rs.y);
    state = 'play';
  });
}

function startJump(sx, sy, tx, ty, onLand) {
  state = 'jumping';
  jump = { sx, sy, tx, ty, t:0, dur:28, onLand };
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const t = e.changedTouches[0];
  handleTap(t.clientX - r.left, t.clientY - r.top);
}, { passive: false });
canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  handleTap(e.clientX - r.left, e.clientY - r.top);
});

// ── DESSIN ───────────────────────────────────────────────────────
function drawBG() {
  const topH = H*0.16;
  ctx.fillStyle = '#3a6b20'; ctx.fillRect(0, 0, W, topH);
  for (let x = 8; x < W; x += 16) {
    ctx.fillStyle = x%32===8 ? '#4a8428' : '#56a030';
    ctx.fillRect(x, topH-10, 4, 10);
    ctx.fillRect(x+6, topH-14, 3, 14);
  }
  ctx.fillStyle = '#0e7a6e'; ctx.fillRect(0, topH-5, W, H*0.76);
  for (let layer = 0; layer < 5; layer++) {
    const alpha  = [0.12,0.09,0.07,0.06,0.04][layer];
    const freq   = [0.030,0.022,0.018,0.014,0.010][layer];
    const speed  = [1.0,0.7,1.3,0.5,0.9][layer];
    const yBase  = topH + H*0.76*(0.1+layer*0.18);
    ctx.fillStyle = `rgba(32,200,180,${alpha})`;
    ctx.beginPath(); ctx.moveTo(0, yBase);
    for (let x = 0; x <= W; x += 6)
      ctx.lineTo(x, yBase + Math.sin(x*freq + waveT*speed + layer)*14);
    ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  }
  const botY = H*0.84;
  ctx.fillStyle = '#2d5a18'; ctx.fillRect(0, botY, W, H-botY);
  ctx.fillStyle = '#3a7020'; ctx.fillRect(0, botY, W, 12);
  for (let x = 8; x < W; x += 16) {
    ctx.fillStyle = x%32===8 ? '#4a8428' : '#56a030';
    ctx.fillRect(x, botY, 4, 10);
    ctx.fillRect(x+7, botY, 3, 13);
  }
  const treeY = [60,130,210,290,380,460,550,630];
  treeY.forEach((y, i) => {
    drawTree(i%2===0?14:20, y, 20+i%3*4);
    drawTree(i%2===0?W-14:W-20, y+30, 18+i%3*5);
  });
}

function drawTree(x, y, r) {
  ctx.fillStyle='#2a1a08'; ctx.fillRect(x-3,y,5,r*0.7);
  ctx.fillStyle='#1a4a08'; ctx.beginPath(); ctx.arc(x,y-r*0.2,r*0.9,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#256010'; ctx.beginPath(); ctx.arc(x-r*0.3,y-r*0.5,r*0.65,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#308018'; ctx.beginPath(); ctx.arc(x+r*0.2,y-r*0.7,r*0.6,0,Math.PI*2); ctx.fill();
}

function drawRock(r, idx) {
  const occupied = idx === playerRock;
  const rs = getRockState(r, waveT, occupied);
  if (!rs.visible) return;
  const { x, y, sinkVal } = rs;
  const sink  = Math.min(sinkVal, 1);
  const scale = 1 - sink*0.45;
  const alpha = 1 - sink*0.9;
  if (alpha <= 0) return;
  const rw = 28, rh = 19;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y + sink*18);

  if (sink > 0.05) {
    ctx.fillStyle = `rgba(0,0,0,${0.18*sink})`;
    ctx.beginPath(); ctx.ellipse(2, rh*scale+4, rw*scale*0.85, rh*scale*0.4, 0,0,Math.PI*2); ctx.fill();
  }
  const bright = 1 - sink*0.4;
  const grad = ctx.createRadialGradient(-rw*scale*0.15, -rh*scale*0.2, 1, 0, 0, rw*scale);
  grad.addColorStop(0, `rgba(${Math.round(210*bright)},${Math.round(175*bright)},${Math.round(120*bright)},1)`);
  grad.addColorStop(0.55,`rgba(${Math.round(140*bright)},${Math.round(100*bright)},${Math.round(65*bright)},1)`);
  grad.addColorStop(1,   `rgba(${Math.round(80*bright)}, ${Math.round(55*bright)}, ${Math.round(35*bright)}, 1)`);
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.ellipse(0,0,rw*scale,rh*scale,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = `rgba(60,38,20,${0.6*alpha})`; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(0,0,rw*scale,rh*scale,0,0,Math.PI*2); ctx.stroke();
  if (sink < 0.3) {
    ctx.fillStyle = `rgba(255,240,200,${0.3*(1-sink/0.3)})`;
    ctx.beginPath(); ctx.ellipse(-rw*scale*0.2,-rh*scale*0.3,rw*scale*0.4,rh*scale*0.25,-0.2,0,Math.PI*2); ctx.fill();
  }
  if (sink < 0.5 && state === 'play' && !occupied) {
    const safe = sink < 0.18;
    ctx.strokeStyle = safe
      ? `rgba(100,255,120,${(0.18-sink)/0.18*0.7})`
      : `rgba(255,80,80,${(0.5-sink)/0.5*0.4})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0,0,rw*scale+5,rh*scale+4,0,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();

  if (sink > 0.05 && sink < 0.7) {
    const wa = Math.min(sink*2,1)*(1-sink/0.7)*0.35;
    ctx.strokeStyle = `rgba(100,230,210,${wa})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(x, y+sink*18, rw*scale+8+sink*5, 6,0,0,Math.PI*2); ctx.stroke();
  }
}

function drawPlatform(x, y, w, h, label) {
  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(x+4,y+h/2+5,w/2,h/3,0,0,Math.PI*2); ctx.fill();
  const g = ctx.createRadialGradient(x-w*0.2,y-h*0.2,2,x,y,w/2);
  g.addColorStop(0,'#d4a85a'); g.addColorStop(0.6,'#a87030'); g.addColorStop(1,'#6b4518');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(x,y,w/2,h/2,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#5a3010'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(x,y,w/2,h/2,0,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='rgba(255,235,180,0.35)';
  ctx.beginPath(); ctx.ellipse(x-w*0.12,y-h*0.22,w*0.25,h*0.18,-0.2,0,Math.PI*2); ctx.fill();
  if (label) {
    ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
    ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=4;
    ctx.fillText(label, x, y+4); ctx.shadowBlur=0;
  }
}

function drawPlayer(x, y, squishY) {
  squishY = squishY || 1;
  ctx.save(); ctx.translate(x,y); ctx.scale(1,squishY);
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0,15/squishY,13,5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a6abf';
  ctx.beginPath(); ctx.ellipse(0,3,11,13,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1050a0';
  ctx.beginPath(); ctx.ellipse(0,6,9,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffcb8a';
  ctx.beginPath(); ctx.arc(0,-9,12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3e2510';
  ctx.beginPath(); ctx.arc(0,-15,10,Math.PI*1.1,Math.PI*1.9,false); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-9,12,Math.PI*1.1,Math.PI*1.9,true); ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(-4,-10,2.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 4,-10,2.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-3,-11,0.9,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 5,-11,0.9,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#7a4020'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(0,-6,3.5,0.15,Math.PI-0.15); ctx.stroke();
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    if (p.type === 'ripple') {
      ctx.strokeStyle=`rgba(100,220,210,${p.life*0.6})`; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.stroke();
    } else {
      ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }
  });
}

function drawHUD() {
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.roundRect(W/2-130,6,260,30,15); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
  const msgs=['Touche les cailloux quand ils sortent de l\'eau !','Saute au bon moment !','Attention au timing !','Continue !','Presque arrivé !'];
  ctx.fillText(msgs[Math.min(playerRock+1, msgs.length-1)], W/2, 26);
}

function drawOverlay(emoji, title, sub, btnLabel, btnColor) {
  ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,H);
  ctx.font='58px serif'; ctx.textAlign='center'; ctx.fillText(emoji,W/2,H/2-42);
  ctx.fillStyle='#FFD700'; ctx.font='bold 24px sans-serif';
  ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=8;
  ctx.fillText(title,W/2,H/2+10); ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.65)'; ctx.font='13px sans-serif';
  ctx.fillText(sub,W/2,H/2+36);
  ctx.fillStyle=btnColor;
  ctx.beginPath(); ctx.roundRect(W/2-72,H/2+54,144,44,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 16px sans-serif';
  ctx.fillText(btnLabel,W/2,H/2+82);
}

// ── UPDATE ────────────────────────────────────────────────────────
function update() {
  waveT += 0.9;
  particles.forEach(p => {
    if (p.type==='ripple') { p.r+=1.8; p.life-=p.decay; }
    else { p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life-=p.decay; }
  });
  particles = particles.filter(p => p.life > 0);

  if (state==='jumping' && jump) {
    jump.t++;
    if (jump.t >= jump.dur) {
      const cb = jump.onLand; jump = null; cb && cb();
    }
  }
}

// ── RENDER ────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0,0,W,H);
  drawBG();
  drawPlatform(W*0.5, H*0.11, 80, 50, 'DÉPART');
  drawPlatform(W*0.5, H*0.88, 80, 50, 'ARRIVÉE');
  rocks.forEach((r, i) => drawRock(r, i));
  drawParticles();

  let px, py, squish = 1;
  if (state==='jumping' && jump) {
    const prog = jump.t / jump.dur;
    const ease = prog<0.5 ? 2*prog*prog : 1-2*(1-prog)*(1-prog);
    px = jump.sx + (jump.tx-jump.sx)*ease;
    py = jump.sy + (jump.ty-jump.sy)*ease - Math.sin(prog*Math.PI)*52;
    squish = 1 + Math.sin(prog*Math.PI)*0.2;
  } else if (playerRock === -1) {
    px = W*0.5; py = H*0.11-10;
  } else {
    const rs = getRockState(rocks[playerRock], waveT, true);
    px = rs.x; py = rs.y - 10;
  }
  drawPlayer(px, py, squish);
  drawHUD();

  if (state==='dead') drawOverlay('💧','Tombé !','Le caillou était sous l\'eau...','▶ Réessayer','#c62020');
  if (state==='win')  drawOverlay('🎉','Traversée réussie !','Bravo champion !','▶ Rejouer','#1560c0');
}

function loop() { update(); render(); requestAnimationFrame(loop); }
resetGame();
loop();
</script>
</body>
</html>

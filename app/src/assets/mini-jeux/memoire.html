<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mémoire du Bagne · KAVAL</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0B1F3A;
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; overflow:hidden; touch-action:manipulation;
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = Math.min(window.innerWidth,  420);
const H = Math.min(window.innerHeight, 896);

// Résolution réelle du canvas = taille CSS × devicePixelRatio, sinon le
// navigateur agrandit un bitmap trop petit sur un écran haute densité
// (téléphone récent) et les images/texte ressortent flous/pixelisés.
const DPR = window.devicePixelRatio || 1;
canvas.width  = Math.round(W * DPR);
canvas.height = Math.round(H * DPR);
canvas.style.width  = W + 'px';
canvas.style.height = H + 'px';
ctx.scale(DPR, DPR);

// ── Palette bleue ─────────────────────────────────────────────────────────────
const COL = {
  blue1:   '#0B1F3A',
  blue2:   '#1B3E70',
  blue3:   '#2E6BAB',
  blue4:   '#5B9FDB',
  accent:  '#F2EDE4',          // crème (remplace gold)
  accentD: 'rgba(242,237,228,0.55)',
  text:    '#0A1E35',
  grey:    '#4A6080',
};

// ── Langue (alignée sur le choix FR/EN fait dans le reste de l'app KAVAL,
// stocké par LanguageService via @capacitor/preferences ; en mode web,
// Capacitor Preferences écrit directement dans localStorage) ───────────────
const LANG = localStorage.getItem('CapacitorStorage.kaval_langue') === 'en' ? 'en' : 'fr';
document.documentElement.lang = LANG;

const I18N = {
  fr: {
    titre: 'Mémoire du Bagne',
    sousTitre: 'Île Nou · Nouvelle-Calédonie',
    essais: n => `Essais : ${n}`,
    paires: n => `Paires : ${n} / 5`,
    instructions: "Retrouvez les 5 paires d'objets du bagne",
    chargement: 'Chargement…',
    felicitations: 'Félicitations !',
    bilan: (n, s) => `${n} essais  ·  ${s} s`,
    rejouer: '▶  Rejouer',
  },
  en: {
    titre: 'Bagne Memory',
    sousTitre: 'Île Nou · New Caledonia',
    essais: n => `Tries: ${n}`,
    paires: n => `Pairs: ${n} / 5`,
    instructions: 'Find the 5 penal colony object pairs',
    chargement: 'Loading…',
    felicitations: 'Congratulations!',
    bilan: (n, s) => `${n} tries  ·  ${s} s`,
    rejouer: '▶  Play again',
  },
};
const T = I18N[LANG];

// ── Config Supabase (clé publique anon — lecture seule, RLS "using (true)") ────
// Mêmes identifiants que le reste de l'app (voir environment.prod.ts) et même
// mécanisme que le Tribunal du Bagne (voir tribunal.html) : une table pilote
// le contenu (ici les 5 paires), un bucket Storage public héberge les images.
const SUPABASE_URL      = 'https://onuavovmdbfigwfbagtd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9udWF2b3ZtZGJmaWd3ZmJhZ3RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNzc4NzQsImV4cCI6MjA5Nzg1Mzg3NH0.J3FL0tb9S0xjIobkCo3Q833bg1GAFqUnxsj3nkptDNI';
const BUCKET_URL = `${SUPABASE_URL}/storage/v1/object/public/memoire`;

// ── 5 paires avec images ────────────────────────────────────────────────────
// Repli si Supabase est injoignable ou si memoire_paires est encore vide
// (voir migrations_memoire.sql) : le jeu reste jouable hors-ligne.
const PAIRS_REPLI = [
  { id:0, key:'nacre',    label:'Nacre',    labelEn:'Mother-of-pearl' },
  { id:1, key:'chaine',   label:'Chaîne',   labelEn:'Chain'           },
  { id:2, key:'brique',   label:'Brique',   labelEn:'Brick'           },
  { id:3, key:'chapelle', label:'Chapelle', labelEn:'Chapel'          },
  { id:4, key:'lampe',    label:'Lampe',    labelEn:'Lamp'            },
];
let PAIRS = PAIRS_REPLI.map(p => ({ ...p, label: LANG === 'en' ? p.labelEn : p.label }));

async function chargerPaires() {
  try {
    const resp = await fetch(
      `${SUPABASE_URL}/rest/v1/memoire_paires?select=cle,label,label_en,ordre&order=ordre.asc`,
      { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    if (!resp.ok) throw new Error('http ' + resp.status);
    const lignes = await resp.json();
    if (Array.isArray(lignes) && lignes.length > 0) {
      PAIRS = lignes.map((l, i) => ({ id:i, key:l.cle, label: (LANG === 'en' && l.label_en) ? l.label_en : l.label }));
    }
  } catch {
    // Hors-ligne ou bucket/table pas encore configurés : PAIRS reste sur PAIRS_REPLI.
  }
}

// ── Chargement images ─────────────────────────────────────────────────────────
const IMG = {};
let IMG_KEYS = ['verso', ...PAIRS.map(p => p.key)];

// ── Fond dégradé animé ──────────────────────────────────────────────────────
// Même principe que #jeu dans tribunal.html (dégradé diagonal qui ondule),
// transposé en canvas puisque ce jeu se dessine entièrement sur <canvas> —
// remplace l'ancienne photo floutée (plus de fond.png à charger/uploader).
// Blanc cassé / bleu clair : mêmes teintes que le fond carte et le remplissage
// "water" ailleurs dans l'app (#f7f2e7 / #cfe3ee, voir map.page.ts).
const FOND_COULEURS = ['#F7F2E7', '#CFE3EE', '#F7F2E7'];

function drawFondAnime(t) {
  const periode = 16000; // ~16s, comme degradeMouvant côté tribunal.html
  const angle = Math.PI * 0.25 + Math.sin((t / periode) * Math.PI * 2) * 0.35;
  const diag = Math.sqrt(W*W + H*H);
  const cx = W/2, cy = H/2;
  const dx = Math.cos(angle) * diag/2, dy = Math.sin(angle) * diag/2;
  const grad = ctx.createLinearGradient(cx-dx, cy-dy, cx+dx, cy+dy);
  FOND_COULEURS.forEach((c, i) => grad.addColorStop(i/(FOND_COULEURS.length-1), c));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

// ── Particules flottantes ────────────────────────────────────────────────────
// Petits points qui dérivent lentement vers le haut, façon poussière en
// suspension — purement décoratif, dessiné entre le fond et le HUD/cartes
// (donc toujours derrière). Fond très clair (crème/bleu pâle) : du blanc y
// serait quasi invisible, donc particules dans le bleu foncé de la palette.
const N_PARTICULES = 22;
let particules = [];
function initParticules() {
  particules = Array.from({ length: N_PARTICULES }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: 3 + Math.random() * 5.5,
    vy: 0.12 + Math.random() * 0.22,
    derive: Math.random() * Math.PI * 2,
    alpha: 0.18 + Math.random() * 0.22,
  }));
}

function drawParticules(t) {
  ctx.save();
  particules.forEach(p => {
    p.y -= p.vy;
    p.x += Math.sin(t / 2200 + p.derive) * 0.12;
    if (p.y < -8) { p.y = H + 8; p.x = Math.random() * W; }
    if (p.x < -8) p.x = W + 8;
    if (p.x > W + 8) p.x = -8;
    ctx.beginPath();
    ctx.fillStyle = `rgba(46,107,171,${p.alpha})`;
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

function loadImages(cb) {
  let loaded = 0;
  IMG_KEYS.forEach(key => {
    const img = new Image();
    img.onload  = () => { if (++loaded === IMG_KEYS.length) cb(); };
    img.onerror = () => { if (++loaded === IMG_KEYS.length) cb(); };
    img.src = `${BUCKET_URL}/${key}.png`;
    IMG[key] = img;
  });
}

// ── Mise en page ──────────────────────────────────────────────────────────────
// Disposition 3+2+2+3 = 10 cartes (comme la capture)
const COLS_G    = 3;
const CARD_ROWS = 4;
const PAD  = Math.floor(W * 0.038);
const GAP  = Math.floor(W * 0.030);
const HDR  = Math.floor(H * 0.120);
const FTR  = Math.floor(H * 0.080);

const C_W_max = Math.floor((W - PAD*2 - GAP*(COLS_G-1)) / COLS_G);
const C_H_max = Math.floor((H - HDR - FTR - GAP*(CARD_ROWS-1) - PAD*0.6) / CARD_ROWS);
const C_S     = Math.min(C_W_max, C_H_max);   // carré

const GRID_W = COLS_G * C_S + (COLS_G-1) * GAP;
const GRID_H = CARD_ROWS * C_S + (CARD_ROWS-1) * GAP;
const GX     = Math.floor((W - GRID_W) / 2);
const GY     = HDR + Math.floor((H - HDR - FTR - GRID_H) / 2);

// Positions explicites : rangées 1&4 ont 3 cartes, rangées 2&3 ont 2 cartes
// (colonnes 0 et 2, la colonne centrale est vide comme sur la capture)
const POSITIONS = [
  {col:0,row:0},{col:1,row:0},{col:2,row:0},  // rangée 1 : 3 cartes
  {col:0,row:1},{col:2,row:1},                 // rangée 2 : cols 0 et 2
  {col:0,row:2},{col:2,row:2},                 // rangée 3 : cols 0 et 2
  {col:0,row:3},{col:1,row:3},{col:2,row:3},  // rangée 4 : 3 cartes
];

// ── État ──────────────────────────────────────────────────────────────────────
let cards, flipped, moves, pairsFound, state, startTime;

function shuffle(arr) {
  for (let i=arr.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function init() {
  const deck = [];
  PAIRS.forEach(p => {
    deck.push({...p, faceUp:false, matched:false, flash:0, flashColor:'#FFFFFF', flipStart:0, flipFrom:false});
    deck.push({...p, faceUp:false, matched:false, flash:0, flashColor:'#FFFFFF', flipStart:0, flipFrom:false});
  });
  shuffle(deck);
  cards      = deck;
  flipped    = [];
  moves      = 0;
  pairsFound = 0;
  state      = 'play';
  startTime  = Date.now();
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function cardPos(i) {
  const p = POSITIONS[i];
  return { x: GX + p.col*(C_S+GAP), y: GY + p.row*(C_S+GAP) };
}

function hitCard(tx, ty) {
  for (let i=0; i<cards.length; i++) {
    const {x,y} = cardPos(i);
    if (tx>=x && tx<x+C_S && ty>=y && ty<y+C_S) return i;
  }
  return -1;
}

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function clip(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.clip(); }

function imgCover(img, x, y, w, h) {
  const ir = img.naturalWidth / img.naturalHeight;
  const cr = w / h;
  let sx, sy, sw, sh;
  if (ir > cr) {
    sh = img.naturalHeight; sw = sh * cr; sx = (img.naturalWidth-sw)/2; sy = 0;
  } else {
    sw = img.naturalWidth; sh = sw/cr; sx = 0; sy = (img.naturalHeight-sh)/2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

function imgOk(key) {
  const im = IMG[key];
  return im && im.complete && im.naturalWidth > 0;
}

// Retournement : lance une animation visuelle (scale horizontal) sans
// attendre — la face affichée pendant l'anim est l'ancienne, puis la
// nouvelle à mi-course (voir drawCard), comme une vraie carte qui pivote.
const FLIP_MS = 300;
function declencherFlip(c) {
  c.flipFrom  = c.faceUp;
  c.flipStart = performance.now();
}

// ── Interaction ───────────────────────────────────────────────────────────────
function onTap(tx, ty) {
  if (state === 'win') { init(); return; }
  if (state !== 'play') return;

  const i = hitCard(tx, ty);
  if (i < 0) return;
  const c = cards[i];
  if (c.faceUp || c.matched || flipped.includes(i) || flipped.length >= 2) return;

  declencherFlip(c);
  c.faceUp = true;
  flipped.push(i);

  if (flipped.length === 2) {
    moves++;
    state = 'check';
    const [a, b] = flipped;
    setTimeout(() => {
      if (cards[a].id === cards[b].id) {
        cards[a].matched = cards[b].matched = true;
        cards[a].flash = cards[b].flash = 45;
        cards[a].flashColor = cards[b].flashColor = '#FFFFFF';
        pairsFound++;
        flipped = [];
        state = 'play';
        if (pairsFound === PAIRS.length) setTimeout(() => {
          state = 'win';
          window.parent?.postMessage({ type: 'jeuTermine' }, '*');
        }, 900);
      } else {
        cards[a].flash = cards[b].flash = 35;
        cards[a].flashColor = cards[b].flashColor = '#9A2A1A';
        setTimeout(() => {
          declencherFlip(cards[a]); declencherFlip(cards[b]);
          cards[a].faceUp = cards[b].faceUp = false;
          flipped = [];
          state = 'play';
        }, 650);
      }
    }, 800);
  }
}

canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  onTap(e.clientX - r.left, e.clientY - r.top);
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const t = e.changedTouches[0];
  onTap(t.clientX - r.left, t.clientY - r.top);
}, { passive:false });

// ── Rendu cartes ──────────────────────────────────────────────────────────────
function drawBack(x, y, s) {
  ctx.save();
  clip(x, y, s, s, 12);
  if (imgOk('verso')) {
    imgCover(IMG['verso'], x, y, s, s);
  } else {
    ctx.fillStyle = COL.blue2; ctx.fillRect(x, y, s, s);
    ctx.strokeStyle = COL.accent; ctx.lineWidth = 2;
    ctx.strokeRect(x+5, y+5, s-10, s-10);
  }
  ctx.restore();
}

function drawFace(x, y, s, card) {
  ctx.save();
  clip(x, y, s, s, 12);
  if (imgOk(card.key)) {
    imgCover(IMG[card.key], x, y, s, s);
  } else {
    ctx.fillStyle = '#c8daf0'; ctx.fillRect(x, y, s, s);
    ctx.fillStyle = COL.text;
    ctx.font = `bold ${Math.floor(s*0.15)}px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(card.label, x+s/2, y+s/2);
  }
  ctx.restore();
  ctx.strokeStyle = COL.accent; ctx.lineWidth = 2.5;
  rr(x+1.5, y+1.5, s-3, s-3, 11); ctx.stroke();
}

function drawCard(i, now) {
  const c = cards[i];
  const {x, y} = cardPos(i);

  ctx.fillStyle = 'rgba(11,31,58,0.22)';
  rr(x+3, y+6, C_S, C_S, 13); ctx.fill();

  // Halo lumineux doux pour une paire trouvée — dessiné avant la carte pour
  // qu'il déborde visuellement tout autour d'elle (pas de vert, pas de coche).
  if (c.matched) {
    ctx.save();
    ctx.shadowColor = 'rgba(255,255,255,0.95)';
    ctx.shadowBlur  = Math.floor(C_S * 0.26);
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth   = 3;
    rr(x+1.5, y+1.5, C_S-3, C_S-3, 11); ctx.stroke();
    ctx.restore();
  }

  // Retournement : scale horizontal qui passe par 0 à mi-course, moment où
  // la face affichée bascule de l'ancienne à la nouvelle (comme une vraie
  // carte vue de profil).
  let faceVisible = c.faceUp || c.matched;
  let scaleX = 1;
  if (c.flipStart) {
    const p = Math.min(1, (now - c.flipStart) / FLIP_MS);
    scaleX = Math.abs(Math.cos(p * Math.PI));
    faceVisible = p < 0.5 ? c.flipFrom : (c.faceUp || c.matched);
    if (p >= 1) c.flipStart = 0;
  }

  ctx.save();
  ctx.translate(x + C_S/2, y);
  ctx.scale(Math.max(scaleX, 0.04), 1);
  ctx.translate(-(x + C_S/2), -y);

  if (faceVisible) {
    drawFace(x, y, C_S, c);
    if (c.matched) {
      // Légère éclaircie de la carte elle-même, en plus du halo autour.
      ctx.save();
      ctx.globalAlpha = 0.16;
      ctx.fillStyle = '#FFFFFF';
      rr(x, y, C_S, C_S, 12); ctx.fill();
      ctx.restore();
    }
  } else {
    drawBack(x, y, C_S);
  }
  ctx.restore();

  if (c.flash > 0) {
    ctx.globalAlpha = (c.flash / 45) * 0.50;
    ctx.fillStyle   = c.flashColor;
    rr(x, y, C_S, C_S, 12); ctx.fill();
    ctx.globalAlpha = 1;
    c.flash--;
  }
}

// ── HUD header & footer ───────────────────────────────────────────────────────
function drawHUD() {
  // Titre principal
  ctx.fillStyle   = COL.text;
  ctx.font        = `bold ${Math.floor(W*0.060)}px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif`;
  ctx.textAlign   = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(T.titre, W/2, HDR * 0.38);

  // Sous-titre
  ctx.fillStyle = COL.grey;
  ctx.font      = `bold ${Math.floor(W*0.033)}px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif`;
  ctx.fillText(T.sousTitre, W/2, HDR * 0.72);

  // Compteurs (footer)
  const sy = GY + GRID_H + Math.floor(FTR * 0.46);
  ctx.fillStyle   = COL.text;
  ctx.font        = `bold ${Math.floor(W*0.040)}px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillText(T.essais(moves), PAD, sy);
  ctx.textAlign = 'right';
  ctx.fillText(T.paires(pairsFound), W - PAD, sy);

  if (moves === 0) {
    ctx.fillStyle = COL.grey;
    ctx.font      = `bold ${Math.floor(W*0.030)}px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(T.instructions, W/2, sy + Math.floor(FTR*0.46));
  }

  ctx.textBaseline = 'alphabetic';
}

// ── Écran victoire ────────────────────────────────────────────────────────────
function drawWin(t) {
  drawFondAnime(t);
  drawParticules(t);

  ctx.textAlign = 'center';

  const tS = Math.floor(W * 0.28);
  const tx = W/2 - tS/2, ty = H * 0.18;
  const cleTrophee = PAIRS[0]?.key;
  if (cleTrophee && imgOk(cleTrophee)) {
    ctx.save(); clip(tx, ty, tS, tS, 14);
    imgCover(IMG[cleTrophee], tx, ty, tS, tS);
    ctx.restore();
    ctx.strokeStyle = COL.blue3; ctx.lineWidth = 2.5;
    rr(tx+1, ty+1, tS-2, tS-2, 13); ctx.stroke();
  }

  ctx.fillStyle = COL.text;
  ctx.font = `bold ${Math.floor(W*0.068)}px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif`;
  ctx.textBaseline = 'middle';
  ctx.fillText(T.felicitations, W/2, H * 0.46);

  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const stars = moves <= 8 ? 3 : moves <= 13 ? 2 : 1;
  ctx.font = `${Math.floor(W*0.075)}px serif`;
  ctx.fillText('⭐'.repeat(stars) + '☆'.repeat(3-stars), W/2, H * 0.535);

  ctx.fillStyle = COL.grey;
  ctx.font = `bold ${Math.floor(W*0.040)}px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif`;
  ctx.fillText(T.bilan(moves, elapsed), W/2, H * 0.595);

  const bW = Math.floor(W * 0.56), bH = 54;
  const bx = W/2 - bW/2, by = H * 0.648;
  ctx.fillStyle = COL.blue2;
  rr(bx, by, bW, bH, 14); ctx.fill();
  ctx.strokeStyle = COL.accent; ctx.lineWidth = 2;
  rr(bx, by, bW, bH, 14); ctx.stroke();
  ctx.fillStyle = COL.accent;
  ctx.font = `bold ${Math.floor(W*0.046)}px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif`;
  ctx.fillText(T.rejouer, W/2, by + bH/2 + 1);

  ctx.textBaseline = 'alphabetic';
}

// ── Chargement ────────────────────────────────────────────────────────────────
function drawLoading() {
  ctx.fillStyle = FOND_COULEURS[0];
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = COL.text;
  ctx.font = `bold ${Math.floor(W*0.045)}px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(T.chargement, W/2, H/2);
}

// ── Boucle ────────────────────────────────────────────────────────────────────
function loop(t) {
  const now = t || performance.now();
  drawFondAnime(now);
  drawParticules(now);
  drawHUD();
  for (let i=0; i<cards.length; i++) drawCard(i, now);
  if (state === 'win') drawWin(now);
  requestAnimationFrame(loop);
}

drawLoading();
initParticules();
chargerPaires().then(() => {
  IMG_KEYS = ['verso', ...PAIRS.map(p => p.key)];
  loadImages(() => { init(); loop(); });
});
</script>
</body>
</html>

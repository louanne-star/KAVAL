<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Jeu des 7 différences</title>
<style>
:root{box-sizing:border-box;--bg:#faf6ee;--fg:#2b2620;--card:#fff;--mut:#7a6f60;--ac:#c0392b;--ok:#2e8b57;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a16;--fg:#f1ebe0;--card:#2a2621;--mut:#a89c8a}}
:root[data-theme="dark"]{--bg:#1d1a16;--fg:#f1ebe0;--card:#2a2621;--mut:#a89c8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{overscroll-behavior:none}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:10px}
@media(max-width:899px){body{height:100dvh;overflow:hidden}}
h1{font-size:1.05rem;margin:2px 0;flex-shrink:0}.bar{display:flex;gap:10px;align-items:center;margin:4px 0;flex-wrap:wrap;justify-content:center;flex-shrink:0}
.dots{display:flex;gap:6px}.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--mut)}.dot.on{background:var(--ok);border-color:var(--ok)}
button{font:inherit;font-size:14px;padding:10px 16px;min-height:40px;border-radius:12px;border:0;background:var(--ac);color:#fff;touch-action:manipulation}button:active{transform:scale(0.96)}button:disabled{opacity:.45;pointer-events:none}
.imgs{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%;flex:1;min-height:0}
@media(min-width:900px){.imgs{display:grid;grid-template-columns:1fr 1fr;max-width:720px;gap:14px;flex:none}}
.pic{position:relative;border-radius:12px;overflow:hidden;background:var(--card);touch-action:manipulation}
.pic img{display:block;width:100%;height:auto;-webkit-user-drag:none;user-select:none}
@media(min-width:900px){.pic img{width:100%;height:auto}}
.mk{position:absolute;border:4px solid var(--ok);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.ko{position:absolute;color:var(--ac);font-size:2rem;font-weight:700;transform:translate(-50%,-50%);pointer-events:none;animation:f .6s forwards}
.hint{animation:p 1s 3}@keyframes f{to{opacity:0}}@keyframes p{50%{box-shadow:0 0 0 12px #f1c40f}}
#msg{min-height:1.1em;text-align:center;font-weight:600;font-size:13px;padding:0 10px;flex-shrink:0}
</style></head><body>

<script>
const LANG = localStorage.getItem('CapacitorStorage.kaval_langue') === 'en' ? 'en' : 'fr';
document.documentElement.lang = LANG;
const I18N = {
  fr: {
    titre: 'Jeu des 7 différences',
    intro: "Touchez une différence dans l'une des deux images.",
    trouvees: function(n){ return n + ' / 7 trouvées'; },
    victoire: 'Bravo ! Vous avez trouvé les 7 différences 🎉',
    indice: function(n){ return 'Indice (' + n + ')'; },
    rejouer: 'Rejouer',
  },
  en: {
    titre: 'Spot the 7 Differences',
    intro: 'Tap a difference in either image.',
    trouvees: function(n){ return n + ' / 7 found'; },
    victoire: 'Well done! You found all 7 differences 🎉',
    indice: function(n){ return 'Hint (' + n + ')'; },
    rejouer: 'Play again',
  },
};
const T = I18N[LANG];
var HINT_MAX=3,hintsUsed=0;
document.title = T.titre;
document.getElementById('h1').textContent = T.titre;
document.getElementById('hb').textContent = T.indice(HINT_MAX);
document.getElementById('rb').textContent = T.rejouer;
var Z=[{"n": "Fenêtre", "x": 65.68, "y": 7.73, "r": 6.0}, {"n": "Palmier", "x": 23.34, "y": 21.76, "r": 7.0}, {"n": "Pierre", "x": 52.14, "y": 20.92, "r": 4.5}, {"n": "Poignée", "x": 65.2, "y": 61.76, "r": 3.5}, {"n": "Sac", "x": 49.23, "y": 70.08, "r": 7.0}, {"n": "Jarre", "x": 81.06, "y": 83.45, "r": 7.0}, {"n": "Rayure", "x": 29.99, "y": 90.38, "r": 4.0}],found=[],sec=0,tm,done=false;
var dots=document.getElementById('dots'),msg=document.getElementById('msg');
function updateHintBtn(){var hb=document.getElementById('hb'),left=HINT_MAX-hintsUsed;hb.textContent=T.indice(left);hb.disabled=left<=0||done;}
function init(){found=[];done=false;hintsUsed=0;
document.querySelectorAll('.mk,.ko').forEach(function(e){e.remove()});dots.innerHTML='';Z.forEach(function(){var d=document.createElement('div');d.className='dot';dots.appendChild(d)});msg.textContent=T.intro;updateHintBtn();}
var MARK_MIN_PX=28;
function mark(z,cls){document.querySelectorAll('.pic').forEach(function(p){var rect=p.getBoundingClientRect();var d=Math.max(z.r*2,(MARK_MIN_PX/rect.width)*100);var m=document.createElement('div');m.className=cls||'mk';m.style.left=z.x+'%';m.style.top=z.y+'%';m.style.width=m.style.height=d+'%';if(cls==='hint'){m.className='mk hint';setTimeout(function(){m.remove()},3000)}p.appendChild(m)})}
document.querySelectorAll('.pic').forEach(function(p){p.addEventListener('click',function(e){if(done)return;var r=p.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;
var TAP_MIN_PX=26;var hit=-1;Z.forEach(function(z,i){if(found.indexOf(i)<0){var tol=Math.max(z.r,(TAP_MIN_PX/r.width)*100)*1.15;if(Math.hypot(x-z.x,y-z.y)<=tol)hit=i}});
if(hit>=0){found.push(hit);mark(Z[hit]);dots.children[found.length-1].classList.add('on');if(navigator.vibrate)navigator.vibrate(30);
msg.textContent=T.trouvees(found.length);if(found.length===7){done=true;msg.textContent=T.victoire;updateHintBtn();setTimeout(function(){window.parent.postMessage({type:'jeuTermine'},'*');},1500);}}
else{var k=document.createElement('div');k.className='ko';k.textContent='✕';k.style.left=x+'%';k.style.top=y+'%';p.appendChild(k);setTimeout(function(){k.remove()},600)}})});
document.getElementById('hb').onclick=function(){if(done||hintsUsed>=HINT_MAX)return;for(var i=0;i<Z.length;i++)if(found.indexOf(i)<0){mark(Z[i],'hint');break}hintsUsed++;updateHintBtn();};
document.getElementById('rb').onclick=init;init();

// Sous les ~900px (mobile), les deux images sont empilées : on les
// dimensionne pour qu'elles tiennent toutes les deux à l'écran sans scroll
// (sinon impossible de comparer les deux images facilement). `.pic` reçoit
// une taille en px calculée à partir du ratio réel de l'image, pour que la
// zone cliquable reste strictement égale à l'image affichée (le calcul en
// % des différences et des marqueurs suppose .pic === la boîte de l'image).
var imgsEl=document.querySelector('.imgs'),pics=document.querySelectorAll('.pic');
function ajusterTaille(){
  if(window.innerWidth>=900){pics.forEach(function(p){p.style.width='';p.style.height=''});return;}
  var img0=pics[0].querySelector('img');
  if(!img0.naturalWidth){return;}
  var ratio=img0.naturalWidth/img0.naturalHeight;
  var gap=8,availH=imgsEl.clientHeight,availW=imgsEl.clientWidth;
  var h=Math.min((availH-gap)/2,availW/ratio),w=h*ratio;
  pics.forEach(function(p){p.style.width=w+'px';p.style.height=h+'px'});
}
var img0=pics[0].querySelector('img');
if(img0.complete)ajusterTaille();else img0.onload=ajusterTaille;
window.addEventListener('resize',ajusterTaille);
window.addEventListener('orientationchange',function(){setTimeout(ajusterTaille,50)});
</script></body></html>

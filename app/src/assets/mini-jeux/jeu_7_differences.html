<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Jeu des 7 différences</title>
<style>
:root{box-sizing:border-box;--bg:#faf6ee;--fg:#2b2620;--card:#fff;--mut:#7a6f60;--ac:#c0392b;--ok:#2e8b57;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a16;--fg:#f1ebe0;--card:#2a2621;--mut:#a89c8a}}
:root[data-theme="dark"]{--bg:#1d1a16;--fg:#f1ebe0;--card:#2a2621;--mut:#a89c8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{overscroll-behavior:none}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{font-size:1.2rem;margin:4px 0}.bar{display:flex;gap:12px;align-items:center;margin:8px 0 12px;flex-wrap:wrap;justify-content:center}
.dots{display:flex;gap:7px}.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--mut)}.dot.on{background:var(--ok);border-color:var(--ok)}
button{font:inherit;font-size:15px;padding:12px 20px;min-height:44px;border-radius:12px;border:0;background:var(--ac);color:#fff;touch-action:manipulation}button:active{transform:scale(0.96)}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:640px;margin:0 auto}@media(min-width:900px){.imgs{max-width:720px;gap:14px}}
.pic{position:relative;border-radius:12px;overflow:hidden;background:var(--card);touch-action:manipulation}
.pic img{display:block;width:100%;height:auto;-webkit-user-drag:none;user-select:none}
.mk{position:absolute;border:4px solid var(--ok);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.ko{position:absolute;color:var(--ac);font-size:2rem;font-weight:700;transform:translate(-50%,-50%);pointer-events:none;animation:f .6s forwards}
.hint{animation:p 1s 3}@keyframes f{to{opacity:0}}@keyframes p{50%{box-shadow:0 0 0 12px #f1c40f}}
#msg{min-height:1.5em;text-align:center;font-weight:600;font-size:15px;padding:0 10px}
</style></head><body>

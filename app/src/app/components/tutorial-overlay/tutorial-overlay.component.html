<ng-container *ngIf="tutorialService.etapeCourante() as e">

  <!-- Découpe lumineuse autour de la cible : le voile assombrit tout l'écran
       via son propre box-shadow massif (voir spotStyle()/scss), qui épouse
       nativement la forme de la cible (cercle, coins arrondis...) plutôt
       qu'un cadre carré fixe. Sans cible, on retombe sur un voile plein. -->
  <div class="tuto-spot" *ngIf="rect; else voilePlein" [ngStyle]="spotStyle()"></div>
  <ng-template #voilePlein>
    <div class="tuto-voile"></div>
  </ng-template>

  <!-- Bulle explicative -->
  <div class="tuto-bulle" #bulleEl [ngStyle]="positionBulle()">
    <div class="tuto-pointe" *ngIf="pointeVisible()" [ngClass]="pointeClasse()" [ngStyle]="pointeStyle()"></div>
    <div class="tuto-bulle-etape">{{ 'tuto.etape' | translate:{n: tutorialService.etapeIndex() + 1, total: tutorialService.total} }}</div>
    <h3 class="tuto-bulle-titre">{{ e.titreKey | translate }}</h3>
    <p class="tuto-bulle-texte">{{ e.texteKey | translate }}</p>
    <div class="tuto-bulle-actions">
      <button class="tuto-btn-passer" (click)="passer()">{{ 'tuto.passer' | translate }}</button>
      <button class="tuto-btn-suivant" (click)="suivant()">{{ 'tuto.suivant' | translate }}</button>
    </div>
  </div>

</ng-container>

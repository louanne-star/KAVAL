<ion-content [fullscreen]="true">
  <div class="auth-container">

    <!-- Logo -->
    <div class="auth-logo">
      <span class="logo-shell">🐚</span>
      <span class="logo-name">KAVAL</span>
    </div>

    <p class="auth-pourquoi">
      {{ 'auth.oublie.intro' | translate }}
    </p>

    <!-- Card -->
    <div class="auth-card">

      <h1 class="auth-titre">{{ 'auth.oublie.titre' | translate }}</h1>

      <!-- Succès : message volontairement neutre, ne confirme jamais si le compte existe -->
      <div class="auth-succes" *ngIf="envoye()">
        <p>{{ 'auth.oublie.envoye' | translate }}</p>
        <a class="auth-retour" routerLink="/login">{{ 'auth.oublie.retourConnexion' | translate }}</a>
      </div>

      <!-- Formulaire -->
      <form *ngIf="!envoye()" (ngSubmit)="soumettre()" #form="ngForm">

        <div class="auth-champ">
          <label class="auth-label">{{ 'auth.champs.email' | translate }}</label>
          <input class="auth-input"
                 type="email"
                 placeholder="votre@email.com"
                 [(ngModel)]="email"
                 name="email"
                 autocomplete="email"
                 required />
        </div>

        <!-- Erreur -->
        <div class="auth-erreur" *ngIf="erreur()">
          ⚠ {{ erreur() }}
        </div>

        <!-- Bouton -->
        <button class="auth-btn" type="submit" [disabled]="chargement()">
          <span *ngIf="!chargement()">
            {{ 'auth.oublie.bouton' | translate }}
          </span>
          <span *ngIf="chargement()" class="auth-loader"></span>
        </button>

        <a class="auth-retour" routerLink="/login">{{ 'auth.oublie.retourConnexion' | translate }}</a>

      </form>

    </div>

  </div>
</ion-content>

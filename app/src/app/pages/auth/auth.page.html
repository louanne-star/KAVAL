<ion-content [fullscreen]="true">
  <div class="auth-container">

    <!-- Logo -->
    <div class="auth-logo">
      <span class="logo-shell">🐚</span>
      <span class="logo-name">KAVAL</span>
    </div>

    <!-- Pourquoi se connecter -->
    <p class="auth-pourquoi">
      {{ 'auth.pourquoi' | translate }}
    </p>

    <!-- Card -->
    <div class="auth-card">

      <!-- Onglets -->
      <div class="auth-tabs">
        <button class="auth-tab"
                [class.actif]="onglet === 'connexion'"
                (click)="basculerOnglet('connexion')">
          {{ 'auth.onglets.connexion' | translate }}
        </button>
        <button class="auth-tab"
                [class.actif]="onglet === 'inscription'"
                (click)="basculerOnglet('inscription')">
          {{ 'auth.onglets.inscription' | translate }}
        </button>
      </div>

      <!-- Formulaire -->
      <form (ngSubmit)="soumettre()" #form="ngForm">

        <div class="auth-champ">
          <label class="auth-label">{{ 'auth.champs.email' | translate }}</label>
          <input class="auth-input"
                 type="email"
                 placeholder="votre@email.com"
                 [(ngModel)]="email"
                 name="email"
                 autocomplete="email"
                 required />
        </div>

        <div class="auth-champ">
          <label class="auth-label">{{ 'auth.champs.motDePasse' | translate }}</label>
          <input class="auth-input"
                 type="password"
                 placeholder="••••••••"
                 [(ngModel)]="motDePasse"
                 name="motDePasse"
                 [autocomplete]="onglet === 'connexion' ? 'current-password' : 'new-password'"
                 minlength="8"
                 required />
          <p class="auth-aide" *ngIf="onglet === 'inscription'">
            {{ 'auth.mdpAide' | translate }}
          </p>
        </div>

        <!-- RGPD (inscription uniquement) -->
        <div class="auth-rgpd" *ngIf="onglet === 'inscription'">
          <label class="auth-rgpd-ligne">
            <input type="checkbox" [(ngModel)]="rgpdAccepte" name="rgpdAccepte" />
            <span>
              {{ 'auth.rgpd.accepte' | translate }}
              <button type="button" class="auth-rgpd-lien" (click)="toggleRgpdDetail()">
                {{ (rgpdDetailOuvert ? 'auth.rgpd.masquer' : 'auth.rgpd.enSavoirPlus') | translate }}
              </button>
            </span>
          </label>
          <p class="auth-rgpd-detail" *ngIf="rgpdDetailOuvert">
            {{ 'auth.rgpd.detail' | translate }}
          </p>
        </div>

        <!-- Erreur -->
        <div class="auth-erreur" *ngIf="erreur()">
          ⚠ {{ erreur() }}
        </div>

        <!-- Bouton -->
        <button class="auth-btn" type="submit" [disabled]="chargement()">
          <span *ngIf="!chargement()">
            {{ (onglet === 'connexion' ? 'auth.bouton.connexion' : 'auth.bouton.inscription') | translate }}
          </span>
          <span *ngIf="chargement()" class="auth-loader"></span>
        </button>

      </form>

    </div>

    <!-- Note offline -->
    <p class="auth-note">
      {{ 'auth.note' | translate }}
    </p>

  </div>
</ion-content>

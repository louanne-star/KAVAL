<ion-content [fullscreen]="true">
  <div class="page">

    <!-- ── Header décoratif ─────────────────────────────────────────────── -->
    <div class="rch-header">
      <div class="rch-orb rch-orb--1" aria-hidden="true"></div>
      <div class="rch-orb rch-orb--2" aria-hidden="true"></div>

      <button class="rch-back" (click)="retour()">‹</button>

      <div class="rch-title-row">
        <div>
          <p class="rch-eyebrow">Île Nou</p>
          <h1 class="rch-title">Explorer</h1>
        </div>
        <div class="rch-count-badge">
          <span class="rch-count-num">{{ resultats().length }}</span>
          <span class="rch-count-lbl">zone{{ resultats().length > 1 ? 's' : '' }}</span>
        </div>
      </div>

      <!-- Wave SVG -->
      <div class="rch-wave" aria-hidden="true">
        <svg class="wave-bg" viewBox="0 0 390 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0,35 C70,88 160,5 240,52 C300,82 355,18 390,38 L390,100 L0,100 Z" fill="rgba(255,255,255,0.22)"/>
        </svg>
        <svg class="wave-main" viewBox="0 0 390 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0,58 C90,100 195,28 305,70 C348,86 374,52 390,62 L390,100 L0,100 Z" fill="#f0f4fb"/>
        </svg>
      </div>
    </div>

    <!-- ── Barre de recherche sticky ────────────────────────────────────── -->
    <div class="rch-search-sticky">
      <div class="rch-search">
        <ion-icon name="search-outline" class="rch-ico"></ion-icon>
        <input class="rch-input" type="search" placeholder="Rechercher une zone…"
               [value]="terme()"
               (input)="terme.set($any($event.target).value)" />
        <button class="rch-clear" *ngIf="terme()" (click)="terme.set('')"
                aria-label="Effacer">✕</button>
      </div>

      <!-- Filtres chips -->
      <div class="rch-chips">
        <button class="chip" [class.chip--on]="filtre() === 'tous'"    (click)="filtre.set('tous')">Tout voir</button>
        <button class="chip" [class.chip--on]="filtre() === 'visites'" (click)="filtre.set('visites')">Visités 🏅</button>
        <button class="chip" [class.chip--on]="filtre() === 'favoris'" (click)="filtre.set('favoris')">Favoris ♡</button>
      </div>
    </div>

    <!-- ── Résultats ────────────────────────────────────────────────────── -->
    <div class="rch-content">
      <div class="zone-grid" *ngIf="resultats().length > 0; else aucun">
        <div class="zone-card" *ngFor="let z of resultats(); let i = index"
             [style.animation-delay]="i * 55 + 'ms'"
             (click)="allerVersZone(z.id)">

          <div class="zc-top">
            <div class="zc-ico" [ngClass]="'ico-' + z.id">{{ META[z.id]?.icone }}</div>
            <div class="zc-badges">
              <span *ngIf="badgeService.aBadge(z.id)">🏅</span>
              <span class="zc-heart" *ngIf="favoriteService.estFavori(z.id)">♡</span>
            </div>
          </div>

          <div class="zc-name">{{ z.nom }}</div>
          <div class="zc-sub">{{ META[z.id]?.sousTitre }}</div>

          <div class="zc-footer">
            <span class="zc-stars">{{ starsFor(ratingService.getNote(z.id)) }}</span>
            <button class="zc-map" (click)="allerVersCarte(z.id); $event.stopPropagation()"
                    aria-label="Voir sur la carte">
              <ion-icon name="map-outline"></ion-icon>
            </button>
          </div>

        </div>
      </div>

      <ng-template #aucun>
        <div class="rch-empty">
          <div class="rch-empty-ico">🔍</div>
          <h2 class="rch-empty-h">Aucun résultat</h2>
          <p class="rch-empty-p">Aucune zone ne correspond à votre recherche.</p>
        </div>
      </ng-template>
    </div>

  </div>
</ion-content>

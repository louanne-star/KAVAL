[build]
  base    = "app"
  command = "npm run build"
  publish = "www"

[build.environment]
  NODE_VERSION = "22.12.0"

# Le service worker et ses fichiers de contrôle de version ne doivent jamais
# rester en cache côté CDN/navigateur, sinon la détection de nouvelle version
# (voir AppUpdateService) peut être retardée bien au-delà de la mise en ligne
# réelle.
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

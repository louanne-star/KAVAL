<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Traverse la Rivière</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0d1f0d;
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; overflow:hidden; touch-action:none;
}
#stage { position:relative; }
#bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
canvas { position:relative; display:block; background:transparent; }
</style>
</head>
<body>
<div id="stage">
  <img id="bg" src="bg-riviere.gif" alt="">
  <canvas id="c"></canvas>
</div>
<script>
const stage = document.getElementById('stage');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = Math.min(window.innerWidth, 420);
const H = Math.min(window.innerHeight, 720);
canvas.width = W; canvas.height = H;
stage.style.width = W + 'px'; stage.style.height = H + 'px';

// ── SPRITES ──────────────────────────────────────────────────────
function chargerImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(img);
    img.src = src;
  });
}
const IMAGES = {};
const imagesPretes = Promise.all([
  ['planche', 'planche.png'], ['depart', 'depart.png'],
  ['arrivee', 'arrivee.png'], ['info', 'i.png'],
].map(([k, src]) => chargerImage(src).then(img => { IMAGES[k] = img; })));

// Vitesse de disparition des plateformes réduite de 60% au total (niveau
// encore jugé trop difficile après des passages à 0.8 puis 0.55) : chaque
// rocher reste émergé nettement plus longtemps avant de recommencer à
// couler, laissant plus de marge pour repérer et taper la bonne cible.
const RALENTI_DISPARITION = 0.40;

// Vitesse de balancement latéral/vertical des planches, également réduite
// pour un jeu plus calme (indépendant de la vitesse de disparition ci-dessus).
const VITESSE_BALANCEMENT = 0.65;

// Fenêtre de saut : un rocher est sautable/affiché tant que sa valeur de
// "sinkVal" reste sous ce seuil. Remonté de 0.18 à 0.30 pour élargir la
// fenêtre de timing acceptée.
const SEUIL_SAUTABLE = 0.30;

function makeRocks() {
  return [
    // 7 planches au lieu de 10, repositionnées pour rester dans le chenal
    // d'eau du fond (vérifié en échantillonnant les pixels du GIF de fond) ;
    // amplitudes latérales réduites sur les rangées où le chenal est étroit.
    { bx:W*0.47, by:H*0.20, ang:-0.08, lat:{a:16,sp:0.018,ph:0},   dep:{a:9, sp:0.013,ph:1.0}, sink:{sp:0.022,ph:0.0} },
    { bx:W*0.70, by:H*0.32, ang: 0.10, lat:{a:24,sp:0.015,ph:2.1}, dep:{a:10,sp:0.017,ph:0.5}, sink:{sp:0.019,ph:2.4} },
    { bx:W*0.40, by:H*0.42, ang: 0.05, lat:{a:22,sp:0.021,ph:1.2}, dep:{a:11,sp:0.011,ph:2.2}, sink:{sp:0.025,ph:1.1} },
    { bx:W*0.61, by:H*0.52, ang:-0.12, lat:{a:26,sp:0.016,ph:3.3}, dep:{a:8, sp:0.014,ph:0.8}, sink:{sp:0.020,ph:3.5} },
    { bx:W*0.33, by:H*0.62, ang: 0.07, lat:{a:16,sp:0.019,ph:0.7}, dep:{a:9, sp:0.016,ph:1.5}, sink:{sp:0.023,ph:0.8} },
    { bx:W*0.505,by:H*0.72, ang:-0.06, lat:{a:12,sp:0.017,ph:2.8}, dep:{a:7, sp:0.012,ph:3.1}, sink:{sp:0.021,ph:2.0} },
    { bx:W*0.535,by:H*0.80, ang: 0.11, lat:{a:20,sp:0.020,ph:1.9}, dep:{a:8, sp:0.015,ph:0.3}, sink:{sp:0.024,ph:1.6} },
  ].map(r => ({
    ...r,
    lat:  { ...r.lat,  sp: r.lat.sp  * VITESSE_BALANCEMENT },
    dep:  { ...r.dep,  sp: r.dep.sp  * VITESSE_BALANCEMENT },
    sink: { ...r.sink, sp: r.sink.sp * RALENTI_DISPARITION },
  }));
}

let rocks, playerRock, state, jump, waveT, particles;
let aideOuverte = false;

function resetGame() {
  rocks = makeRocks();
  playerRock = -1;
  state = 'play';
  jump = null;
  waveT = 0;
  particles = [];
}
resetGame();

// ── ROCK STATE ───────────────────────────────────────────────────
function getRockState(r, t, occupied) {
  const lx = r.bx + Math.sin(t * r.lat.sp + r.lat.ph) * r.lat.a;
  const dy = Math.sin(t * r.dep.sp + r.dep.ph) * r.dep.a;
  const ly = r.by + dy;
  const raw = Math.sin(t * r.sink.sp + r.sink.ph);
  let sinkVal = raw > 0.3 ? 0 : (0.3 - raw) / 1.3;
  if (occupied) sinkVal = 0;
  const visible = sinkVal < 0.92;
  return { x: lx, y: ly, sinkVal, visible };
}

function isJumpable(rockIdx) {
  const s = getRockState(rocks[rockIdx], waveT, rockIdx === playerRock);
  return s.sinkVal < SEUIL_SAUTABLE;
}

// ── PARTICULES ───────────────────────────────────────────────────
function splash(x, y, color) {
  for (let i = 0; i < 14; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 1 + Math.random() * 3.5;
    particles.push({ x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd-2,
      life:1, decay:0.03+Math.random()*0.03, r:2+Math.random()*4, color });
  }
}
function ripple(x, y) {
  particles.push({ type:'ripple', x, y, r:4, life:1, decay:0.025 });
}

// ── INPUT ────────────────────────────────────────────────────────
function handleTap(cx, cy) {
  if (aideOuverte) { aideOuverte = false; return; }
  const aide = aideXY();
  if (Math.hypot(cx-aide.x, cy-aide.y) < AIDE_D*0.7) { aideOuverte = true; return; }

  if (state === 'win') { resetGame(); return; }
  if (state !== 'play') return;

  let fromX, fromY;
  if (playerRock === -1) {
    fromX = W*0.5; fromY = H*0.11;
  } else {
    const rs = getRockState(rocks[playerRock], waveT, true);
    fromX = rs.x; fromY = rs.y;
  }

  // Seuls les rochers actuellement affichés (donc sautables, cf. drawRock)
  // sont sélectionnables.
  let best = -1, bestD = 9999;
  rocks.forEach((r, i) => {
    if (i === playerRock) return;
    if (!isJumpable(i)) return;
    const rs = getRockState(r, waveT, false);
    const d = Math.hypot(cx - rs.x, cy - rs.y);
    if (d < 72 && d < bestD) { bestD = d; best = i; }
  });

  const arrX = W*0.5, arrY = H*0.88;
  if (Math.hypot(cx-arrX, cy-arrY) < 55 && playerRock >= 5) {
    startJump(fromX, fromY, arrX, arrY, () => {
      state = 'win';
      setTimeout(() => window.parent.postMessage({ type: 'jeuTermine' }, '*'), 1800);
    });
    return;
  }

  if (best < 0) return;

  const rs = getRockState(rocks[best], waveT, false);

  const MAX_JUMP = 160;
  if (Math.hypot(fromX - rs.x, fromY - rs.y) > MAX_JUMP) return;

  // Seuls les rochers sautables (cf. filtre ci-dessus) sont proposés comme
  // cible, donc plus de "chute dans l'eau" surprise sur un rocher qui
  // semblait valide.
  startJump(fromX, fromY, rs.x, rs.y, () => {
    playerRock = best;
    splash(rs.x, rs.y, 'rgba(200,255,240,0.8)');
    ripple(rs.x, rs.y);
    state = 'play';
  });
}

function startJump(sx, sy, tx, ty, onLand) {
  state = 'jumping';
  jump = { sx, sy, tx, ty, t:0, dur:28, onLand };
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const t = e.changedTouches[0];
  handleTap(t.clientX - r.left, t.clientY - r.top);
}, { passive: false });
canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  handleTap(e.clientX - r.left, e.clientY - r.top);
});

// ── DESSIN ───────────────────────────────────────────────────────
// Le fond (rives, forêt, eau) est le GIF animé #bg affiché sous le canvas
// transparent. Les planches, pontons et le bouton d'aide sont les sprites
// dessinés par l'illustrateur (bucket Supabase "riviere"), chargés dans
// IMAGES — seule la mécanique (halo, montée de l'eau, ombre) reste en canvas.

const PLANCHE_D = 68; // planche.png est une image carrée (disque de bois)

function drawRock(r, idx) {
  const occupied = idx === playerRock;
  const rs = getRockState(r, waveT, occupied);
  // Un rocher non sautable ne s'affiche plus du tout (au lieu d'apparaître
  // encore visible/valide alors qu'il ferait tomber le joueur à l'eau).
  if (rs.sinkVal >= SEUIL_SAUTABLE) return;
  const { x, y, sinkVal } = rs;
  const sink  = Math.min(sinkVal, 1);
  const alpha = 1 - sink*0.75;
  if (alpha <= 0) return;
  const d = PLANCHE_D;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y + sink*14);
  ctx.rotate(r.ang || 0);

  // Ombre douce portée sur l'eau (dégradé plutôt qu'un aplat)
  const shadowA = 0.24*(1-sink*0.5);
  const sg = ctx.createRadialGradient(2, d*0.32, 2, 2, d*0.32, d*0.55);
  sg.addColorStop(0, `rgba(15,25,20,${shadowA})`);
  sg.addColorStop(1, 'rgba(15,25,20,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.ellipse(2, d*0.32, d*0.55, d*0.24, 0,0,Math.PI*2); ctx.fill();

  if (IMAGES.planche) ctx.drawImage(IMAGES.planche, -d/2, -d/2, d, d);

  // Ligne d'eau qui monte sur la planche à mesure qu'elle coule (dégradé
  // adouci, découpé au disque de la planche)
  if (sink > 0.02) {
    const niveau = d/2 - sink/SEUIL_SAUTABLE * d;
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, d/2, 0, Math.PI*2); ctx.clip();
    const wg = ctx.createLinearGradient(0, niveau-12, 0, niveau+18);
    wg.addColorStop(0,   'rgba(90,140,170,0)');
    wg.addColorStop(0.5, 'rgba(70,120,155,0.5)');
    wg.addColorStop(1,   'rgba(55,100,135,0.62)');
    ctx.fillStyle = wg;
    ctx.fillRect(-d/2, niveau-12, d, d);
    ctx.restore();
  }

  ctx.restore();
}

const PANNEAU_W = 140, PANNEAU_H = Math.round(PANNEAU_W * 373/668);

function drawPlatform(x, y, image) {
  ctx.save();
  ctx.translate(x, y);

  const sg = ctx.createRadialGradient(3, PANNEAU_H/2+6, 2, 3, PANNEAU_H/2+6, PANNEAU_W*0.55);
  sg.addColorStop(0, 'rgba(15,25,15,0.28)');
  sg.addColorStop(1, 'rgba(15,25,15,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.ellipse(3, PANNEAU_H/2+6, PANNEAU_W*0.55, PANNEAU_H*0.28, 0,0,Math.PI*2); ctx.fill();

  if (image) ctx.drawImage(image, -PANNEAU_W/2, -PANNEAU_H/2, PANNEAU_W, PANNEAU_H);
  ctx.restore();
}

const AIDE_D = 34;
const aideXY = () => ({ x: W - 26, y: 26 });

function drawBoutonAide() {
  if (!IMAGES.info) return;
  const { x, y } = aideXY();
  ctx.save();
  ctx.globalAlpha = 0.95;
  ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 1;
  ctx.drawImage(IMAGES.info, x-AIDE_D/2, y-AIDE_D/2, AIDE_D, AIDE_D);
  ctx.restore();
}

function drawAide() {
  ctx.fillStyle = 'rgba(0,0,0,0.62)'; ctx.fillRect(0,0,W,H);
  const cw = Math.min(W*0.82, 300), ch = 232;
  const cx = W/2, cy = H/2;
  ctx.fillStyle = '#3a2312';
  ctx.beginPath(); ctx.roundRect(cx-cw/2, cy-ch/2, cw, ch, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(255,210,150,0.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(cx-cw/2, cy-ch/2, cw, ch, 16); ctx.stroke();

  ctx.fillStyle = '#ffd27a'; ctx.font = 'bold 17px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('Comment jouer', cx, cy-ch/2+34);

  ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.font = '13px sans-serif';
  const lignes = [
    'Touche une planche quand elle',
    "sort de l'eau pour sauter dessus.",
    '',
    'Chaque planche finit par recouler :',
    'ne traîne pas trop avant de sauter.',
    '',
    "Atteins le ponton d'arrivée",
    'pour terminer la traversée.',
  ];
  lignes.forEach((l, i) => ctx.fillText(l, cx, cy-ch/2+62+i*18));

  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '11px sans-serif';
  ctx.fillText('(touche l\'écran pour fermer)', cx, cy+ch/2-14);
}

function drawPlayer(x, y, squishY) {
  squishY = squishY || 1;
  ctx.save(); ctx.translate(x,y); ctx.scale(1,squishY);
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0,15/squishY,13,5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a6abf';
  ctx.beginPath(); ctx.ellipse(0,3,11,13,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1050a0';
  ctx.beginPath(); ctx.ellipse(0,6,9,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffcb8a';
  ctx.beginPath(); ctx.arc(0,-9,12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3e2510';
  ctx.beginPath(); ctx.arc(0,-15,10,Math.PI*1.1,Math.PI*1.9,false); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-9,12,Math.PI*1.1,Math.PI*1.9,true); ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(-4,-10,2.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 4,-10,2.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-3,-11,0.9,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 5,-11,0.9,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#7a4020'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(0,-6,3.5,0.15,Math.PI-0.15); ctx.stroke();
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    if (p.type === 'ripple') {
      ctx.strokeStyle=`rgba(100,220,210,${p.life*0.6})`; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.stroke();
    } else {
      ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }
  });
}

function drawHUD() {
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.roundRect(W/2-130,6,260,30,15); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
  const msgs=['Touche les cailloux quand ils sortent de l\'eau !','Saute au bon moment !','Attention au timing !','Continue !','Presque arrivé !'];
  ctx.fillText(msgs[Math.min(playerRock+1, msgs.length-1)], W/2, 26);
}

function drawOverlay(emoji, title, sub, btnLabel, btnColor) {
  ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,H);
  ctx.font='58px serif'; ctx.textAlign='center'; ctx.fillText(emoji,W/2,H/2-42);
  ctx.fillStyle='#FFD700'; ctx.font='bold 24px sans-serif';
  ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=8;
  ctx.fillText(title,W/2,H/2+10); ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.65)'; ctx.font='13px sans-serif';
  ctx.fillText(sub,W/2,H/2+36);
  ctx.fillStyle=btnColor;
  ctx.beginPath(); ctx.roundRect(W/2-72,H/2+54,144,44,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 16px sans-serif';
  ctx.fillText(btnLabel,W/2,H/2+82);
}

// ── UPDATE ────────────────────────────────────────────────────────
function update() {
  waveT += 0.9;
  particles.forEach(p => {
    if (p.type==='ripple') { p.r+=1.8; p.life-=p.decay; }
    else { p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life-=p.decay; }
  });
  particles = particles.filter(p => p.life > 0);

  if (state==='jumping' && jump) {
    jump.t++;
    if (jump.t >= jump.dur) {
      const cb = jump.onLand; jump = null; cb && cb();
    }
  }
}

// ── RENDER ────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0,0,W,H);
  drawPlatform(W*0.5, H*0.11, IMAGES.depart);
  drawPlatform(W*0.5, H*0.88, IMAGES.arrivee);
  rocks.forEach((r, i) => drawRock(r, i));
  drawParticles();

  let px, py, squish = 1;
  if (state==='jumping' && jump) {
    const prog = jump.t / jump.dur;
    const ease = prog<0.5 ? 2*prog*prog : 1-2*(1-prog)*(1-prog);
    px = jump.sx + (jump.tx-jump.sx)*ease;
    py = jump.sy + (jump.ty-jump.sy)*ease - Math.sin(prog*Math.PI)*52;
    squish = 1 + Math.sin(prog*Math.PI)*0.2;
  } else if (playerRock === -1) {
    px = W*0.5; py = H*0.11-10;
  } else {
    const rs = getRockState(rocks[playerRock], waveT, true);
    px = rs.x; py = rs.y - 10;
  }
  drawPlayer(px, py, squish);
  drawHUD();
  drawBoutonAide();

  if (state==='win')  drawOverlay('🎉','Traversée réussie !','Bravo champion !','▶ Rejouer','#1560c0');
  if (aideOuverte) drawAide();
}

function loop() { update(); render(); requestAnimationFrame(loop); }
imagesPretes.then(() => { resetGame(); loop(); });
</script>
</body>
</html>

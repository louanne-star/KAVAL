<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mémoire du Bagne · KAVAL</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0B1F3A;
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; overflow:hidden; touch-action:manipulation;
}
canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = Math.min(window.innerWidth,  420);
const H = Math.min(window.innerHeight, 896);
canvas.width = W; canvas.height = H;

// ── Palette bleue ─────────────────────────────────────────────────────────────
const COL = {
  bg:      '#D6E4F2',          // fond canevas bleu pâle
  hdrBg:   '#0B1F3A',          // header bleu marine profond
  blue1:   '#0B1F3A',
  blue2:   '#1B3E70',
  blue3:   '#2E6BAB',
  blue4:   '#5B9FDB',
  accent:  '#F2EDE4',          // crème (remplace gold)
  accentD: 'rgba(242,237,228,0.55)',
  text:    '#0A1E35',
  grey:    '#4A6080',
};

// ── 5 paires avec images ──────────────────────────────────────────────────────
const PAIRS = [
  { id:0, key:'nacre',    label:'Nacre'    },
  { id:1, key:'chaine',   label:'Chaîne'   },
  { id:2, key:'brique',   label:'Brique'   },
  { id:3, key:'chapelle', label:'Chapelle' },
  { id:4, key:'lampe',    label:'Lampe'    },
];

// ── Chargement images ─────────────────────────────────────────────────────────
const IMG = {};
const IMG_KEYS = ['verso', 'fond', ...PAIRS.map(p => p.key)];

// Canvas offscreen pré-floutée pour le fond
let fondBlur = null;

function buildBlurredBg(img) {
  const oc = document.createElement('canvas');
  oc.width = W; oc.height = H;
  const octx = oc.getContext('2d');
  // Cover-fit
  const ir = img.naturalWidth / img.naturalHeight;
  const cr = W / H;
  let sx, sy, sw, sh;
  if (ir > cr) {
    sh = img.naturalHeight; sw = sh * cr; sx = (img.naturalWidth - sw) / 2; sy = 0;
  } else {
    sw = img.naturalWidth; sh = sw / cr; sx = 0; sy = (img.naturalHeight - sh) / 2;
  }
  octx.filter = 'blur(1px)';
  octx.drawImage(img, sx, sy, sw, sh, -24, -24, W + 48, H + 48);
  octx.filter = 'none';
  // assombrir légèrement pour le contraste
  octx.fillStyle = 'rgba(10,20,50,0.38)';
  octx.fillRect(0, 0, W, H);
  fondBlur = oc;
}

function loadImages(cb) {
  let loaded = 0;
  IMG_KEYS.forEach(key => {
    const img = new Image();
    img.onload  = () => {
      if (key === 'fond') buildBlurredBg(img);
      if (++loaded === IMG_KEYS.length) cb();
    };
    img.onerror = () => { if (++loaded === IMG_KEYS.length) cb(); };
    img.src = `img_memo/${key}.png`;
    IMG[key] = img;
  });
}

// ── Mise en page ──────────────────────────────────────────────────────────────
// Disposition 3+2+2+3 = 10 cartes (comme la capture)
const COLS_G    = 3;
const CARD_ROWS = 4;
const PAD  = Math.floor(W * 0.038);
const GAP  = Math.floor(W * 0.030);
const HDR  = Math.floor(H * 0.120);
const FTR  = Math.floor(H * 0.080);

const C_W_max = Math.floor((W - PAD*2 - GAP*(COLS_G-1)) / COLS_G);
const C_H_max = Math.floor((H - HDR - FTR - GAP*(CARD_ROWS-1) - PAD*0.6) / CARD_ROWS);
const C_S     = Math.min(C_W_max, C_H_max);   // carré

const GRID_W = COLS_G * C_S + (COLS_G-1) * GAP;
const GRID_H = CARD_ROWS * C_S + (CARD_ROWS-1) * GAP;
const GX     = Math.floor((W - GRID_W) / 2);
const GY     = HDR + Math.floor((H - HDR - FTR - GRID_H) / 2);

// Positions explicites : rangées 1&4 ont 3 cartes, rangées 2&3 ont 2 cartes
// (colonnes 0 et 2, la colonne centrale est vide comme sur la capture)
const POSITIONS = [
  {col:0,row:0},{col:1,row:0},{col:2,row:0},  // rangée 1 : 3 cartes
  {col:0,row:1},{col:2,row:1},                 // rangée 2 : cols 0 et 2
  {col:0,row:2},{col:2,row:2},                 // rangée 3 : cols 0 et 2
  {col:0,row:3},{col:1,row:3},{col:2,row:3},  // rangée 4 : 3 cartes
];

// ── État ──────────────────────────────────────────────────────────────────────
let cards, flipped, moves, pairsFound, state, startTime;

function shuffle(arr) {
  for (let i=arr.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function init() {
  const deck = [];
  PAIRS.forEach(p => {
    deck.push({...p, faceUp:false, matched:false, flash:0, flashColor:'#27ae60'});
    deck.push({...p, faceUp:false, matched:false, flash:0, flashColor:'#27ae60'});
  });
  shuffle(deck);
  cards      = deck;
  flipped    = [];
  moves      = 0;
  pairsFound = 0;
  state      = 'play';
  startTime  = Date.now();
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function cardPos(i) {
  const p = POSITIONS[i];
  return { x: GX + p.col*(C_S+GAP), y: GY + p.row*(C_S+GAP) };
}

function hitCard(tx, ty) {
  for (let i=0; i<cards.length; i++) {
    const {x,y} = cardPos(i);
    if (tx>=x && tx<x+C_S && ty>=y && ty<y+C_S) return i;
  }
  return -1;
}

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function clip(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.clip(); }

function imgCover(img, x, y, w, h) {
  const ir = img.naturalWidth / img.naturalHeight;
  const cr = w / h;
  let sx, sy, sw, sh;
  if (ir > cr) {
    sh = img.naturalHeight; sw = sh * cr; sx = (img.naturalWidth-sw)/2; sy = 0;
  } else {
    sw = img.naturalWidth; sh = sw/cr; sx = 0; sy = (img.naturalHeight-sh)/2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

function imgOk(key) {
  const im = IMG[key];
  return im && im.complete && im.naturalWidth > 0;
}

// ── Interaction ───────────────────────────────────────────────────────────────
function onTap(tx, ty) {
  if (state === 'win') { init(); return; }
  if (state !== 'play') return;

  const i = hitCard(tx, ty);
  if (i < 0) return;
  const c = cards[i];
  if (c.faceUp || c.matched || flipped.includes(i) || flipped.length >= 2) return;

  c.faceUp = true;
  flipped.push(i);

  if (flipped.length === 2) {
    moves++;
    state = 'check';
    const [a, b] = flipped;
    setTimeout(() => {
      if (cards[a].id === cards[b].id) {
        cards[a].matched = cards[b].matched = true;
        cards[a].flash = cards[b].flash = 45;
        cards[a].flashColor = cards[b].flashColor = '#27ae60';
        pairsFound++;
        flipped = [];
        state = 'play';
        if (pairsFound === PAIRS.length) setTimeout(() => { state = 'win'; }, 900);
      } else {
        cards[a].flash = cards[b].flash = 35;
        cards[a].flashColor = cards[b].flashColor = '#c0392b';
        setTimeout(() => {
          cards[a].faceUp = cards[b].faceUp = false;
          flipped = [];
          state = 'play';
        }, 650);
      }
    }, 800);
  }
}

canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  onTap(e.clientX - r.left, e.clientY - r.top);
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const t = e.changedTouches[0];
  onTap(t.clientX - r.left, t.clientY - r.top);
}, { passive:false });

// ── Rendu cartes ──────────────────────────────────────────────────────────────
function drawBack(x, y, s) {
  ctx.save();
  clip(x, y, s, s, 12);
  if (imgOk('verso')) {
    imgCover(IMG['verso'], x, y, s, s);
  } else {
    ctx.fillStyle = COL.blue2; ctx.fillRect(x, y, s, s);
    ctx.strokeStyle = COL.accent; ctx.lineWidth = 2;
    ctx.strokeRect(x+5, y+5, s-10, s-10);
  }
  ctx.restore();
}

function drawFace(x, y, s, card) {
  ctx.save();
  clip(x, y, s, s, 12);
  if (imgOk(card.key)) {
    imgCover(IMG[card.key], x, y, s, s);
  } else {
    ctx.fillStyle = '#c8daf0'; ctx.fillRect(x, y, s, s);
    ctx.fillStyle = COL.text;
    ctx.font = `bold ${Math.floor(s*0.15)}px Georgia, serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(card.label, x+s/2, y+s/2);
  }
  ctx.restore();
  ctx.strokeStyle = COL.accent; ctx.lineWidth = 2.5;
  rr(x+1.5, y+1.5, s-3, s-3, 11); ctx.stroke();
}

function drawCard(i) {
  const c = cards[i];
  const {x, y} = cardPos(i);

  ctx.fillStyle = 'rgba(11,31,58,0.22)';
  rr(x+3, y+6, C_S, C_S, 13); ctx.fill();

  if (c.faceUp || c.matched) {
    drawFace(x, y, C_S, c);
    if (c.matched) {
      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = '#27ae60';
      rr(x, y, C_S, C_S, 12); ctx.fill();
      ctx.restore();
      const ck = Math.floor(C_S * 0.28);
      ctx.fillStyle = '#F2EDE4';
      ctx.font = `bold ${ck}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('✓', x + C_S - ck*0.62, y + ck*0.62);
      ctx.textBaseline = 'alphabetic';
    }
  } else {
    drawBack(x, y, C_S);
  }

  if (c.flash > 0) {
    ctx.globalAlpha = (c.flash / 45) * 0.50;
    ctx.fillStyle   = c.flashColor;
    rr(x, y, C_S, C_S, 12); ctx.fill();
    ctx.globalAlpha = 1;
    c.flash--;
  }
}

// ── HUD header & footer ───────────────────────────────────────────────────────
function shadow(blur, color) {
  ctx.shadowBlur  = blur;
  ctx.shadowColor = color;
}
function noShadow() { ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; }

function drawHUD() {
  // Titre principal
  ctx.fillStyle   = '#FFFFFF';
  ctx.font        = `bold ${Math.floor(W*0.060)}px Georgia, serif`;
  ctx.textAlign   = 'center';
  ctx.textBaseline = 'middle';
  shadow(14, 'rgba(0,0,0,0.85)');
  ctx.fillText('Mémoire du Bagne', W/2, HDR * 0.38);

  // Sous-titre
  ctx.fillStyle = COL.accent;
  ctx.font      = `bold ${Math.floor(W*0.033)}px Georgia, serif`;
  shadow(10, 'rgba(0,0,0,0.80)');
  ctx.fillText('Île Nou · Nouvelle-Calédonie', W/2, HDR * 0.72);

  noShadow();

  // Compteurs (footer)
  const sy = GY + GRID_H + Math.floor(FTR * 0.46);
  ctx.fillStyle   = '#FFFFFF';
  ctx.font        = `bold ${Math.floor(W*0.040)}px Georgia, serif`;
  ctx.textBaseline = 'middle';
  shadow(10, 'rgba(0,0,0,0.80)');
  ctx.textAlign = 'left';
  ctx.fillText(`Essais : ${moves}`, PAD, sy);
  ctx.textAlign = 'right';
  ctx.fillText(`Paires : ${pairsFound} / 5`, W - PAD, sy);

  if (moves === 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.82)';
    ctx.font      = `bold ${Math.floor(W*0.030)}px Georgia, serif`;
    ctx.textAlign = 'center';
    shadow(8, 'rgba(0,0,0,0.75)');
    ctx.fillText('Retrouvez les 5 paires d\'objets du bagne', W/2, sy + Math.floor(FTR*0.46));
  }

  noShadow();
  ctx.textBaseline = 'alphabetic';
}

// ── Écran victoire ────────────────────────────────────────────────────────────
function drawWin() {
  if (fondBlur) {
    ctx.drawImage(fondBlur, 0, 0);
    ctx.fillStyle = 'rgba(10,20,50,0.45)';
    ctx.fillRect(0, 0, W, H);
  } else {
    ctx.fillStyle = 'rgba(214,228,242,0.97)';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.textAlign = 'center';

  const tS = Math.floor(W * 0.28);
  const tx = W/2 - tS/2, ty = H * 0.18;
  if (imgOk('nacre')) {
    ctx.save(); clip(tx, ty, tS, tS, 14);
    imgCover(IMG['nacre'], tx, ty, tS, tS);
    ctx.restore();
    ctx.strokeStyle = COL.blue3; ctx.lineWidth = 2.5;
    rr(tx+1, ty+1, tS-2, tS-2, 13); ctx.stroke();
  }

  ctx.fillStyle = '#FFFFFF';
  ctx.font = `bold ${Math.floor(W*0.068)}px Georgia, serif`;
  ctx.textBaseline = 'middle';
  shadow(16, 'rgba(0,0,0,0.85)');
  ctx.fillText('Félicitations !', W/2, H * 0.46);

  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const stars = moves <= 8 ? 3 : moves <= 13 ? 2 : 1;
  noShadow();
  ctx.font = `${Math.floor(W*0.075)}px serif`;
  ctx.fillText('⭐'.repeat(stars) + '☆'.repeat(3-stars), W/2, H * 0.535);

  ctx.fillStyle = COL.accent;
  ctx.font = `bold ${Math.floor(W*0.040)}px Georgia, serif`;
  shadow(10, 'rgba(0,0,0,0.80)');
  ctx.fillText(`${moves} essais  ·  ${elapsed} s`, W/2, H * 0.595);
  noShadow();

  const bW = Math.floor(W * 0.56), bH = 54;
  const bx = W/2 - bW/2, by = H * 0.648;
  ctx.fillStyle = COL.blue2;
  rr(bx, by, bW, bH, 14); ctx.fill();
  ctx.strokeStyle = COL.accent; ctx.lineWidth = 2;
  rr(bx, by, bW, bH, 14); ctx.stroke();
  ctx.fillStyle = COL.accent;
  ctx.font = `bold ${Math.floor(W*0.046)}px Georgia, serif`;
  ctx.fillText('▶  Rejouer', W/2, by + bH/2 + 1);

  ctx.textBaseline = 'alphabetic';
}

// ── Chargement ────────────────────────────────────────────────────────────────
function drawLoading() {
  ctx.fillStyle = COL.hdrBg;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#FFFFFF';
  ctx.font = `bold ${Math.floor(W*0.045)}px Georgia, serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowBlur = 10; ctx.shadowColor = 'rgba(0,0,0,0.7)';
  ctx.fillText('Chargement…', W/2, H/2);
  ctx.shadowBlur = 0;
}

// ── Boucle ────────────────────────────────────────────────────────────────────
function loop() {
  if (fondBlur) {
    ctx.drawImage(fondBlur, 0, 0);
  } else {
    ctx.fillStyle = COL.bg;
    ctx.fillRect(0, 0, W, H);
  }
  drawHUD();
  for (let i=0; i<cards.length; i++) drawCard(i);
  if (state === 'win') drawWin();
  requestAnimationFrame(loop);
}

drawLoading();
loadImages(() => { init(); loop(); });
</script>
</body>
</html>
